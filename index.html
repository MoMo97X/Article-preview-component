<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Article preview component</title>
    <meta name="description" content="" />

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <!-- font :- Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main class="wrapper">
      <article class="card">
        <div class="wrap">
          <img
            class="card-image"
            src="images/drawers.jpg"
            alt="drawers with picture and a vas full of wheat"
          />
        </div>
        <div class="card-info">
          <h1 class="card-info-title">
            Shift the overall look and feel by adding these wonderful touches to
            furniture in your home
          </h1>
          <p class="card-info-description">
            Ever been in a room and felt like something was missing? Perhaps it
            felt slightly bare and uninviting. I’ve got some simple tips to help
            you make any room feel complete.
          </p>
          <div class="card-info-contact">
            <div class="card-meta">
              <img
                class="avatar"
                src="images/avatar-michelle.jpg"
                alt="Michelle Appleton"
                aria-hidden="true"
              />
              <div class="card-meta-info">
                <h2>Michelle Appleton</h2>
                <data value="28 Jun 2020">28 Jun 2020</data>
              </div>
            </div>
            <span class="fa-stack">
              <i class="fa-solid fa-circle fa-stack-2x circle"></i>
              <i class="fa-solid fa-share fa-stack-1x share-arrow"></i>
            </span>
          </div>
        </div>
      </article>
    </main>

    <!-- <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer> -->
  </body>
</html>
